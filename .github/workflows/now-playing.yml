name: listening

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listening
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: render
        if: ${{ secrets.LASTFM_API_KEY != '' }}
        run: python3 .github/listening.py
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: takyon303
          OUTPUT: assets/listening.json

      - name: commit
        if: ${{ secrets.LASTFM_API_KEY != '' }}
        run: |
          if [[ -n "$(git status --porcelain assets/listening.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/listening.json
            git commit -m "listening: update"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push origin "${GITHUB_REF_NAME:-main}"
          fi
